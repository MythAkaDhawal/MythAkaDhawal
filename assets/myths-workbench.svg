  <rect y="9" width="175" height="59" rx="5" fill="#917e61"/><rect width="175" height="59" rx="5" fill="#e3cda1"/>
  <rect x="8" y="6" width="11" height="9" rx="1.5" fill="#9d9076"/><rect x="22" y="6" width="11" height="9" rx="1.5" fill="#9d9076"/><rect x="36" y="6" width="11" height="9" rx="1.5" fill="#9d9076"/><rect x="50" y="6" width="11" height="9" rx="1.5" fill="#9d9076"/><rect x="64" y="6" width="11" height="9" rx="1.5" fill="#9d9076"/><rect x="78" y="6" width="11" height="9" rx="1.5" fill="#9d9076"/><rect x="92" y="6" width="11" height="9" rx="1.5" fill="#9d9076"/><rect x="106" y="6" width="11" height="9" rx="1.5" fill="#9d9076"/><rect x="120" y="6" width="11" height="9" rx="1.5" fill="#9d9076"/><rect x="134" y="6" width="11" height="9" rx="1.5" fill="#9d9076"/><rect x="148" y="6" width="11" height="9" rx="1.5" fill="#9d9076"/><rect x="10" y="18" width="11" height="9" rx="1.5" fill="#9d9076"/><rect x="24" y="18" width="11" height="9" rx="1.5" fill="#9d9076"/><rect x="38" y="18" width="11" height="9" rx="1.5" fill="#9d9076"/><rect x="52" y="18" width="11" height="9" rx="1.5" fill="#9d9076"/><rect x="66" y="18" width="11" height="9" rx="1.5" fill="#9d9076"/><rect x="80" y="18" width="11" height="9" rx="1.5" fill="#9d9076"/><rect x="94" y="18" width="11" height="9" rx="1.5" fill="#9d9076"/><rect x="108" y="18" width="11" height="9" rx="1.5" fill="#9d9076"/><rect x="122" y="18" width="11" height="9" rx="1.5" fill="#9d9076"/><rect x="136" y="18" width="11" height="9" rx="1.5" fill="#9d9076"/><rect x="150" y="18" width="11" height="9" rx="1.5" fill="#9d9076"/><rect x="12" y="30" width="11" height="9" rx="1.5" fill="#9d9076"/><rect x="26" y="30" width="11" height="9" rx="1.5" fill="#9d9076"/><rect x="40" y="30" width="11" height="9" rx="1.5" fill="#9d9076"/><rect x="54" y="30" width="11" height="9" rx="1.5" fill="#9d9076"/><rect x="68" y="30" width="11" height="9" rx="1.5" fill="#9d9076"/><rect x="82" y="30" width="11" height="9" rx="1.5" fill="#9d9076"/><rect x="96" y="30" width="11" height="9" rx="1.5" fill="#9d9076"/><rect x="110" y="30" width="11" height="9" rx="1.5" fill="#9d9076"/><rect x="124" y="30" width="11" height="9" rx="1.5" fill="#9d9076"/><rect x="138" y="30" width="11" height="9" rx="1.5" fill="#9d9076"/><rect x="152" y="30" width="11" height="9" rx="1.5" fill="#df834e"/>
  <rect x="45" y="44" width="77" height="8" rx="2" fill="#a7997f"/>
</g>
