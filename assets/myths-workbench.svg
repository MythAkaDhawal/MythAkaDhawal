<svg xmlns="http://www.w3.org/2000/svg" width="960" height="360" viewBox="0 0 960 360" role="img" aria-labelledby="title desc">
<title id="title">Myth's workbench</title>
<desc id="desc">A cream-coloured isometric terminal tracks a moving hand. A small receipt printer feeds out a highlighted passage beside it.</desc>
<defs>
  <pattern id="grid" width="28" height="14" patternUnits="userSpaceOnUse"><path d="M0 7 14 0 28 7 14 14Z" fill="none" stroke="#314137" stroke-width=".6"/></pattern>
  <pattern id="scan" width="6" height="5" patternUnits="userSpaceOnUse"><path d="M0 4h6" stroke="#96e6bf" opacity=".09"/></pattern>
  <linearGradient id="shell" x2="0" y2="1" gradientUnits="objectBoundingBox"><stop stop-color="#f7e9bd"/><stop offset="1" stop-color="#d4bc8b"/></linearGradient>
  <linearGradient id="glass" x2="1" y2="1"><stop stop-color="#314c43"/><stop offset="1" stop-color="#112c26"/></linearGradient>
  <clipPath id="screen"><rect x="510" y="96" width="187" height="105" rx="12"/></clipPath>
  <style>
    .hand{animation:track 7s ease-in-out infinite}.paper{animation:feed 7s ease-in-out infinite}.lamp{animation:lamp 7s linear infinite}
    @keyframes track{0%,100%{transform:translate(0,0)}40%,55%{transform:translate(12px,-5px)}75%{transform:translate(4px,2px)}}
    @keyframes feed{0%,25%,100%{transform:translateY(4px)}45%,78%{transform:translateY(-4px)}}
    @keyframes lamp{0%,35%,65%,100%{opacity:1}45%,55%{opacity:.35}}
    @media(prefers-reduced-motion:reduce){.hand,.paper,.lamp{animation:none}}
  </style>
</defs>
<rect width="960" height="360" rx="20" fill="#17251f"/>
<path d="M365 360 825 130 960 197V360Z" fill="url(#grid)"/>
<g font-family="monospace" fill="#b9c8ae">
  <path d="M45 65h30" stroke="#ff9862" stroke-width="4"/>
  <text x="88" y="70" font-size="14" letter-spacing="2">DHAWAL LAMBA</text>
  <text x="41" y="156" font-family="Georgia,serif" font-size="75" fill="#f5ebcc">Myth’s</text>
  <text x="41" y="223" font-family="Georgia,serif" font-size="67" fill="#f5ebcc">workbench</text>
  <text x="46" y="302" font-size="14">Vadodara, India</text>
</g>
<!-- Cast shadows and monitor pedestal -->
<path d="m427 275 189 54 225-71-196-39Z" fill="#0b1712" opacity=".7"/>
<path d="m541 250 39-17 123 14-41 20Z" fill="#f3dfad"/><path d="m541 250 121 17v9l-121-17Z" fill="#bba276"/><path d="m662 267 41-20v9l-41 20Z" fill="#8c785b"/>
<path d="m574 210 86 8v36l-86-9Z" fill="#af986e"/><path d="m660 218 27-11v36l-27 11Z" fill="#7d6c50"/>
<!-- The CRT is drawn in three planes; the screen shares the front face's tilt. -->
<path d="m485 58 48-21 217 25-47 22Z" fill="#f6ebcc"/>
<path d="m703 84 47-22v142l-47 23Z" fill="#aa916c"/>
<g stroke="#6e6051" stroke-width="3"><path d="m716 111 23-11"/><path d="m716 117 23-11"/><path d="m716 123 23-11"/><path d="m716 129 23-11"/><path d="m716 135 23-11"/><path d="m716 141 23-11"/><path d="m716 147 23-11"/></g>
<g transform="matrix(1 .115 0 1 0 -52)">
  <rect x="485" y="55" width="220" height="148" rx="7" fill="url(#shell)"/>
  <rect x="498" y="66" width="193" height="113" rx="14" fill="#8b795e"/>
  <g transform="translate(-10 -27)" clip-path="url(#screen)">
    <rect x="510" y="96" width="187" height="105" fill="url(#glass)"/>
    <path d="M522 123v-14h14m135 0h14v14m0 52v14h-14m-135 0h-14v-14" fill="none" stroke="#84a793" stroke-width="2"/>
    <g class="hand" stroke="#a6dfb7" stroke-linecap="round" stroke-linejoin="round">
      <path d="m582 184-18-31 5-5 13 11-6-35 6-3 10 32-2-43 6-1 5 42 5-36 6 1-3 38 9-26 6 3-10 38-10 17Z" fill="#4e7b65" stroke-width="2"/>
      <path d="m583 159 14 12 12-16m-12 16 3 14m-8-32 5 18 4-20" fill="none"/>
      <g fill="#ffc18c" stroke="none"><circle cx="569" cy="151" r="3"/><circle cx="580" cy="124" r="3"/><circle cx="594" cy="111" r="3"/><circle cx="609" cy="118" r="3"/><circle cx="621" cy="131" r="3"/><circle cx="597" cy="171" r="3"/></g>
    </g>
    <rect x="510" y="96" width="187" height="105" fill="url(#scan)"/>
  </g>
  <circle class="lamp" cx="679" cy="190" r="4" fill="#e97940"/><path d="M503 189h29" stroke="#9e8966" stroke-width="3"/>
</g>
<!-- Keyboard, individual keys, and orange return key -->
