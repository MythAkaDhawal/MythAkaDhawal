<g transform="matrix(1 .14 0 1 773 180)"><path d="M0 0h37M0 6h47M0 12h41" stroke="#9c927c" stroke-width="2"/><path d="M0 24h48" stroke="#ffac70" stroke-width="8"/><path d="M0 24h39M0 33h44M0 39h25" stroke="#716e5c" stroke-width="2"/></g></g>
<path d="m754 242 74 11 8-4-74-11Z" fill="#d8bf92"/><circle cx="818" cy="273" r="3" fill="#384e40"/>
</svg>